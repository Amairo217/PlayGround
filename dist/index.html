<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pemandian Gunung Danau</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #1a1a2e;
    color: #e0e0e0;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
  }
  #game-container {
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.6);
    border: 4px solid #3a3a5c;
    border-radius: 12px;
    background: #87ceeb;
    max-width: 100vw;
    max-height: 90vh;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    border-radius: 8px;
  }
  #ui {
    position: absolute;
    top: 12px; left: 12px; right: 12px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 12px;
    pointer-events: none;
    z-index: 10;
  }
  .stat-panel {
    background: rgba(0,0,0,0.55);
    border: 2px solid #555;
    border-radius: 10px;
    padding: 10px 14px;
    min-width: 170px;
    pointer-events: auto;
  }
  .stat-row { display: flex; justify-content: space-between; margin: 4px 0; font-size: 14px; }
  .stat-label { color: #cfcfdf; }
  .stat-value { color: #fff; font-weight: bold; font-family: monospace; }
  .money { color: #ffd700; }
  .energy { color: #7cfc00; }
  .fish { color: #00bfff; }
  .item { color: #ff9800; }

  #overlay {
    position: absolute; inset: 0; background: rgba(0,0,0,0.5);
    display: none; flex-direction: column; align-items: center;
    justify-content: center; z-index: 20; pointer-events: auto;
  }
  #overlay.visible { display: flex; }
  .panel {
    background: #2a2a3e; border: 3px solid #ffd700; border-radius: 14px;
    padding: 22px 30px; min-width: 300px; text-align: center;
    box-shadow: 0 0 25px rgba(255,215,0,0.25);
  }
  .panel h2 { color: #ffd700; margin-bottom: 14px; font-size: 24px; }
  .panel p { margin: 8px 0; color: #ddd; font-size: 15px; line-height: 1.5; }
  .btn-row { margin-top: 16px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    background: #4a4a6a; color: #fff; border: 2px solid #7c7ca0;
    border-radius: 8px; padding: 9px 18px; font-size: 14px; cursor: pointer;
    font-family: inherit; transition: all 0.15s;
  }
  button:hover { background: #6a6a9a; border-color: #ffd700; }
  button.primary { background: #1e90ff; border-color: #4da6ff; }
  button.primary:hover { background: #4da6ff; }
  button.danger { background: #d32f2f; border-color: #ff5252; }
  button.danger:hover { background: #ff5252; }

  #hint {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.6); padding: 8px 16px; border-radius: 20px;
    font-size: 14px; color: #fff; pointer-events: none; z-index: 10;
    border: 1px solid rgba(255,215,0,0.4);
  }
  #msg {
    position: absolute; top: 60px; left: 50%; transform: translateX(-50%);
    background: rgba(20,20,30,0.85); color: #fff; padding: 8px 16px;
    border-radius: 8px; font-size: 14px; pointer-events: none; z-index: 10;
    border: 1px solid rgba(255,215,0,0.3); display: none;
  }
  .controls { position: absolute; bottom: 12px; right: 12px; font-size: 12px; color: #888; pointer-events: none; text-align: right; line-height: 1.4; }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="game" width="1100" height="700"></canvas>

  <div id="ui">
    <div class="stat-panel">
      <div class="stat-row"><span class="stat-label">Uang</span><span class="stat-value money" id="ui-money">Rp 0</span></div>
      <div class="stat-row"><span class="stat-label">Ikan</span><span class="stat-value fish" id="ui-fish">0</span></div>
      <div class="stat-row"><span class="stat-label">Energi</span><span class="stat-value energy" id="ui-energy">100%</span></div>
      <div class="stat-row"><span class="stat-label">Tas</span><span class="stat-value item" id="ui-items">-</span></div>
      <div class="stat-row"><span class="stat-label">Waktu</span><span class="stat-value" id="ui-time">Pagi</span></div>
    </div>
    <div class="stat-panel" style="text-align:right;">
      <div style="color:#aaa;font-size:12px;margin-bottom:6px;">PETUNJUK</div>
      <div style="font-size:12px;line-height:1.6;color:#ddd;">
        WASD / Panah: Gerak<br>
        E: Interaksi / Bicara / Istirahat<br>
        F: Memancing<br>
        Klik: Lempar Batu<br>
        Esc: Tutup menu
      </div>
    </div>
  </div>

  <div id="hint">Arahkan ke objek dan tekan <b>E</b> / <b>F</b> untuk berinteraksi</div>
  <div id="msg"></div>

  <div id="overlay">
    <div class="panel" id="panel">
      <h2 id="panel-title">Menu</h2>
      <div id="panel-content"></div>
      <div class="btn-row" id="panel-btns"></div>
    </div>
  </div>

  <div class="controls">
    Pemandian Gunung Danau &middot; Kaki Pegunungan &bull; Danau &bull; Sungai &bull; Ikan
  </div>
</div>

<script>
/* ============================ KONFIGURASI ============================ */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const TILE = 40;
const FPS = 60;

let money = 50000;
let fishCount = 0;
let energy = 100;
let inventory = []; // daftar item string
let timeOfDay = 'Pagi'; // Pagi, Siang, Sore, Malam
let timeMinutes = 360; // 06:00

/* ============================ STATUS UI ============================ */
function updateUI(){
  document.getElementById('ui-money').textContent = 'Rp ' + money.toLocaleString('id-ID');
  document.getElementById('ui-fish').textContent = fishCount;
  document.getElementById('ui-energy').textContent = energy + '%';
  document.getElementById('ui-items').textContent = inventory.length ? inventory.join(', ') : '-';
  document.getElementById('ui-time').textContent = timeOfDay;
}
function showMsg(text, ms=2200){
  const el = document.getElementById('msg');
  el.textContent = text; el.style.display = 'block';
  setTimeout(()=>{ el.style.display='none'; }, ms);
}

/* ============================ ASET / GAMBAR ============================ */
// Buat semua gambar secara prosedural dengan canvas offscreen agar tidak butuh file eksternal
const off = document.createElement('canvas'); off.width=64; off.height=64;
const octx = off.getContext('2d');

function drawCircle(cx,cy,r,color,stroke){ octx.clearRect(0,0,64,64); octx.fillStyle=color; octx.beginPath(); octx.arc(cx,cy,r,0,Math.PI*2); octx.fill(); if(stroke){octx.strokeStyle=stroke;octx.lineWidth=2;octx.stroke();} return off; }
function rectImg(w,h,color){ const c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d'); x.fillStyle=color; x.fillRect(0,0,w,h); return c; }
function tintImg(img,color){ const c=document.createElement('canvas'); c.width=img.width;c.height=img.height; const x=c.getContext('2d'); x.globalCompositeOperation='source-over'; x.drawImage(img,0,0); x.globalCompositeOperation='source-atop'; x.fillStyle=color; x.fillRect(0,0,img.width,img.height); x.globalCompositeOperation='destination-atop'; x.drawImage(img,0,0); x.globalCompositeOperation='source-over'; return c; }

const IMG = {};
IMG.player = drawCircle(32,32,16,'#e74c3c','#c0392b'); // pemain merah
IMG.npc = drawCircle(32,32,16,'#3498db','#2980b9');
IMG.npcFood = drawCircle(32,32,16,'#e67e22','#d35400');
IMG.npcDrink = drawCircle(32,32,16,'#9b59b6','#8e44ad');
IMG.npcGear = drawCircle(32,32,16,'#2ecc71','#27ae60');
IMG.fish = drawCircle(32,32,10,'#1abc9c','#16a085');
IMG.stone = drawCircle(32,32,8,'#95a5a6','#7f8c8d');
IMG.hook = drawCircle(32,32,4,'#f1c40f','#f39c12');

// Rumah
const houseImg = document.createElement('canvas'); houseImg.width=120; houseImg.height=90;
const hx = houseImg.getContext('2d');
hx.fillStyle='#8b4513'; hx.fillRect(20,50,80,40); // dinding
hx.fillStyle='#a0522d'; hx.fillRect(40,50,40,40); // pintu
hx.fillStyle='#b22222'; hx.beginPath(); hx.moveTo(10,50); hx.lineTo(60,10); hx.lineTo(110,50); hx.closePath(); hx.fill(); // atap
hx.fillStyle='#ffd700'; hx.fillRect(46,52,6,26); // kramem pintu
IMG.house = houseImg;

// Pegunungan (segitiga)
function mountainImg(w,h,color){
  const c=document.createElement('canvas'); c.width=w;c.height=h; const x=c.getContext('2d');
  x.fillStyle=color; x.beginPath(); x.moveTo(w/2,0); x.lineTo(w,h); x.lineTo(0,h); x.closePath(); x.fill();
  x.strokeStyle='rgba(255,255,255,0.25)'; x.lineWidth=2; x.beginPath(); x.moveTo(w/2,0); x.lineTo(w/2*0.4,h*0.9); x.stroke();
  return c;
}
IMG.mtn1 = mountainImg(220,160,'#5d4037');
IMG.mtn2 = mountainImg(200,150,'#6d4c41');
IMG.mtn3 = mountainImg(240,170,'#4e342e');
IMG.snow = mountainImg(120,90,'#cfd8dc');

// Sungai
const riverImg = document.createElement('canvas'); riverImg.width=200; riverImg.height=120;
const rx = riverImg.getContext('2d');
const grad = rx.createLinearGradient(0,0,200,120); grad.addColorStop(0,'#4a90e2'); grad.addColorStop(1,'#1e6fd0');
rx.fillStyle=grad; rx.beginPath(); rx.moveTo(180,120); rx.bezierCurveTo(120,60,80,100,20,20); rx.lineTo(0,120); rx.closePath(); rx.fill();
IMG.river = riverImg;

// Danau
const lakeImg = document.createElement('canvas'); lakeImg.width=560; lakeImg.height=340;
const lx = lakeImg.getContext('2d');
const lg = lx.createRadialGradient(280,170,30,280,170,340); lg.addColorStop(0,'#5dade2'); lg.addColorStop(1,'#1f618d');
lx.fillStyle=lg; lx.beginPath(); lx.ellipse(280,170,250,150,0,0,Math.PI*2); lx.fill();
lx.strokeStyle='rgba(255,255,255,0.25)'; lx.lineWidth=3; lx.beginPath(); lx.ellipse(280,170,250,150,0,0,Math.PI*2); lx.stroke();
IMG.lake = lakeImg;

// Tenda (untuk NPC / dekorasi)
const tentImg = document.createElement('canvas'); tentImg.width=50; tentImg.height=40;
const tx = tentImg.getContext('2d');
tx.fillStyle='#e74c3c'; tx.beginPath(); tx.moveTo(25,0); tx.lineTo(45,35); tx.lineTo(5,35); tx.closePath(); tx.fill();
tx.fillStyle='#95a5a6'; tx.fillRect(20,35,10,5);
IMG.tent = tentImg;

/* ============================ ENTITAS ============================ */
const player = { x: 150, y: 520, w: 30, h: 30, dir: 'down', speed: 2.6, img: IMG.player };
const camera = { x: 0, y: 0 };

const npcs = [];
function addNPC(x,y,profesi,nama,img){
  npcs.push({ x, y, w:28, h:28, profesi, nama, img, vx:(Math.random()-0.5)*0.5, vy:(Math.random()-0.5)*0.5, dir:0, talkTimer:0, stock:[] });
}
// Profesi: makanan, minuman, peralatan
addNPC(260, 560, 'makanan', 'Pak Ujang (Penjual Makanan)', IMG.npcFood);
addNPC(760, 540, 'minuman', 'Bu Siti (Penjual Minuman)', IMG.npcDrink);
addNPC(500, 120, 'peralatan', 'Pak Rizal (Toko Peralatan Gunung)', IMG.npcGear);
addNPC(900, 300, 'pemandu', 'Mbak Lina (Pemandu Pendaki)', IMG.npc);
addNPC(200, 300, 'petani', 'Bapak Joko (Petani Sayur)', IMG.npc);

// Spot memancing di tepi danau
const fishingSpots = [
  {x:300,y:330,r:26},{x:540,y:330,r:26},{x:720,y:300,r:26},
  {x:420,y:40,r:26},{x:180,y:120,r:26},{x:900,y:160,r:26}
];

// Ikan di danau
const fishes = [];
function spawnFish(){
  for(let i=0;i<14;i++){
    fishes.push({
      x: 280 + (Math.random()-0.5)*460,
      y: 170 + (Math.random()-0.5)*260,
      vx: (Math.random()-0.5)*1.2,
      vy: (Math.random()-0.5)*1.2,
      r: 7,
      color: '#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0'),
      caught: false
    });
  }
}
spawnFish();

// Batu yang bisa dilempar (di tepi danau)
const stonePiles = [
  {x:380,y:345,r:18},{x:620,y:315,r:18},{x:220,y:140,r:18}
];

// Rumah
const house = { x: 130, y: 500, w: 120, h: 90, img: IMG.house };

// Tenda dekorasi di sekitar
const tents = [
  {x:820,y:430},{x:930,y:200},{x:100,y:320},{x:980,y:560}
];

// Proyektil batu dilempar
const stones = [];

/* ============================ MENU / DIALOG ============================ */
const overlay = document.getElementById('overlay');
const panel = document.getElementById('panel');
const panelTitle = document.getElementById('panel-title');
const panelContent = document.getElementById('panel-content');
const panelBtns = document.getElementById('panel-btns');

function closeMenu(){ overlay.classList.remove('visible'); }
function openMenu(title, contentHTML, buttonsHTML){
  panelTitle.textContent = title;
  panelContent.innerHTML = contentHTML;
  panelBtns.innerHTML = buttonsHTML;
  overlay.classList.add('visible');
}

function shopMenu(npc){
  let html = `<p style="color:#ffd700;font-weight:bold;">${npc.nama}</p><hr style="margin:8px 0;border-color:#555;">`;
  let btns = '';
  const shop = npcStock(npc.profesi);
  shop.forEach(it=>{
    html += `<div style="display:flex;justify-content:space-between;margin:6px 0;font-size:13px;color:#ddd;">
      <span>${it.name}</span>
      <span style="color:#ffd700;">Rp ${it.price.toLocaleString('id-ID')}</span>
    </div>`;
    btns += `<button class="primary" onclick="buyItem('${it.id}',${it.price},'${it.name}')">Beli ${it.name}</button>`;
  });
  if(fishCount>0 && npc.profesi!=='peralatan'){
    html += `<div style="margin-top:12px;border-top:1px solid #555;padding-top:8px;color:#00bfff;">Jual Ikan: ${fishCount} ekor &times; Rp 15.000</div>`;
    btns += `<button class="primary" onclick="sellFish(${npc.profesi==='makanan'?20000:15000})">Jual Semua Ikan</button>`;
  }
  btns += `<button onclick="closeMenu()">Tutup</button>`;
  openMenu(`${npc.nama} - Toko`, html, btns);
}

function npcStock(profesi){
  if(profesi==='makanan') return [
    {id:'roti',name:'Roti',price:8000,effect:{energy:25}},
    {id:'mie',name:'Mie Instan',price:6000,effect:{energy:20}},
    {id:'nasi',name:'Nasi Goreng',price:12000,effect:{energy:40}}
  ];
  if(profesi==='minuman') return [
    {id:'air',name:'Air Mineral',price:4000,effect:{energy:10}},
    {id:'teh',name:'Teh Panas',price:5000,effect:{energy:15}},
    {id:'kopi',name:'Kopi Gunung',price:9000,effect:{energy:30}}
  ];
  if(profesi==='peralatan') return [
    {id:'tali',name:'Tali Pendak',price:25000,effect:{desc:'Alat pendak'}},
    {id:'tenda',name:'Tenda Gunung',price:60000,effect:{desc:'Tenda untuk berkemah'}},
    {id:'pancing',name:'Tongkat Pancing',price:35000,effect:{desc:'Alat memancing'}},
    {id:'sepatu',name:'Sepatu Pendak',price:45000,effect:{desc:'Sepatu untuk mendaki tebing'}}
  ];
  return [];
}

window.buyItem = function(id,price,name){
  if(money<price){ showMsg('Uang tidak cukup!'); return; }
  if(inventory.length>=8){ showMsg('Tas penuh!'); return; }
  money-=price; inventory.push(name); updateUI(); showMsg('Dibeli: '+name);
  closeMenu();
};
window.sellFish = function(pricePer){
  const total = fishCount*pricePer;
  money+=total; fishCount=0; updateUI(); showMsg('Jual ikan: Rp '+total.toLocaleString('id-ID'));
  closeMenu();
};

function restMenu(){
  const html = `<p style="color:#ffd700;font-weight:bold;">Rumah Istirahat</p>
    <p style="color:#ddd;">Istirahat akan memulihkan energi dan melewatkan waktu.</p>
    <p style="color:#7cfc00;font-weight:bold;">Energi: ${energy}% &rarr; 100%</p>`;
  const btns = `<button class="primary" onclick="doRest()">Istirahat (Malam)</button>
                <button onclick="closeMenu()">Nanti</button>`;
  openMenu('Rumah', html, btns);
}
window.doRest = function(){
  energy = 100;
  timeMinutes = 360; timeOfDay='Pagi';
  updateUI(); closeMenu(); showMsg('Anda tertidur dan bangun pada pagi hari. Energi pulih!');
};

function talkMenu(npc){
  const greetings = {
    makanan:'Selamat datang! Kami jual makanan untuk teman-teman pendaki di sini.',
    minuman:'Segarnya minuman gunung untuk melengkapi perjalanan Anda.',
    peralatan:'Peralatan gunung lengkap: tali, tenda, tongkat pancing, dan sepatu pendak.',
    pemandu:'Saya bisa memandu Anda mendaki tebing di sekitar danau ini.',
    petani:'Sayur-segar dari ladang kami di kaki pegunungan.'
  };
  let html = `<p style="color:#ffd700;font-weight:bold;">${npc.nama}</p>
    <p style="color:#ddd;max-width:260px;line-height:1.5;">${greetings[npc.profesi]||'Halo, sobat pendaki!'}</p>`;
  let btns = '';
  if(['makanan','minuman','peralatan'].includes(npc.profesi)){
    html += `<hr style="margin:10px 0;border-color:#555;"><p style="color:#aaa;font-size:12px;">Lihat toko?</p>`;
    btns += `<button class="primary" onclick="shopMenu(${npcs.indexOf(npc)})">Lihat Toko</button>`;
  }
  btns += `<button onclick="closeMenu()">Tutup</button>`;
  openMenu('Bicara', html, btns);
}

/* ============================ MINIGAME MEMANCING ============================ */
let fishing = false;
let fishTarget = null;
let fishProgress = 0;
let fishBarX = 200;
let fishZone = {x:0,w:120};
let fishSuccess = false;

function startFishing(spot){
  fishing = true; fishTarget = spot; fishProgress = 0;
  fishBarX = 200; fishZone = {x: Math.random()*300+150, w: 90};
  const html = `<p style="color:#00bfff;font-weight:bold;">Memancing...</p>
    <canvas id="fishCanvas" width="420" height="120" style="border:2px solid #555;border-radius:8px;background:#111;display:block;margin:10px auto;"></canvas>
    <p style="color:#fff;font-size:13px;">Tekan <b>SPASI</b> untuk menarik kail saat kail masuk zona hijau!</p>`;
  const btns = `<button onclick="cancelFishing()">Batal</button>`;
  openMenu('Memancing', html, btns);
  requestAnimationFrame(fishLoop);
}
function cancelFishing(){ fishing=false; closeMenu(); showMsg('Memancing dibatalkan.'); }

function fishLoop(){
  if(!fishing){ return; }
  // gerakkan bar
  const dir = fishSuccess?1:(fishBarX>fishZone.x+fishZone.w?-1:(fishBarX<fishZone.x?1:(Math.random()>0.5?1:-1)));
  fishBarX += dir*2.6;
  if(fishBarX<0) fishBarX=0;
  if(fishBarX>420) fishBarX=420;

  const fc = document.getElementById('fishCanvas');
  const fx = fc.getContext('2d');
  fx.clearRect(0,0,420,120);
  // zona hijau
  fx.fillStyle='rgba(46,204,113,0.35)'; fx.fillRect(fishZone.x,40,fishZone.w,40);
  fx.strokeStyle='#2ecc71'; fx.lineWidth=2; fx.strokeRect(fishZone.x,40,fishZone.w,40);
  // kail
  fx.fillStyle='#f1c40f'; fx.beginPath(); fx.arc(fishBarX,60,7,0,Math.PI*2); fx.fill();
  fx.strokeStyle='#b7950b'; fx.lineWidth=2; fx.stroke();

  requestAnimationFrame(fishLoop);
}

window.handleFishSpace = function(){
  if(!fishing) return;
  const inside = fishBarX>=fishZone.x && fishBarX<=fishZone.x+fishZone.w;
  if(inside){
    fishProgress += 18;
    if(fishProgress>=100){
      fishing=false; closeMenu();
      fishCount++; updateUI();
      showMsg('Ikan ditangkap! Total ikan: '+fishCount);
      // respawn ikan baru di mana saja
      if(fishes.length<20) spawnFish();
    } else {
      showMsg('Ikan menggigit! Tekan spasi lagi.');
    }
  } else {
    fishProgress = Math.max(0, fishProgress-8);
    showMsg('Kail melewatkan zona, coba lagi!');
  }
};

/* ============================ INPUT ============================ */
const keys = {};
window.addEventListener('keydown', e=>{
  if(e.key==='Escape'){ closeMenu(); return; }
  keys[e.key.toLowerCase()] = true;
  if(overlay.classList.contains('visible')){
    if(e.key===' ' && fishing) { e.preventDefault(); handleFishSpace(); }
    return;
  }
  if(e.key.toLowerCase()==='e') interact();
  if(e.key.toLowerCase()==='f') tryFishing();
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });
canvas.addEventListener('mousedown', e=>{
  if(overlay.classList.contains('visible')) return;
  const rect = canvas.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * (canvas.width / rect.width);
  const sy = (e.clientY - rect.top) * (canvas.height / rect.height);
  throwStone(sx+sy*0, sy); // x,y world approx
}, {passive:false});
function throwStone(wx, wy){
  // arahkan ke posisi klik dari pemain
  const dx = wx - (player.x - camera.x);
  const dy = wy - (player.y - camera.y);
  const dist = Math.hypot(dx,dy)||1;
  stones.push({
    x: player.x - camera.x + 15, y: player.y - camera.y + 15,
    tx: wx, ty: wy,
    vx: (dx/dist)*9, vy: (dy/dist)*9,
    life: 60, r: 5
  });
  showMsg('Batu dilempar!');
}

/* ============================ INTERAKSI ============================ */
function interact(){
  const px = player.x, py = player.y;
  // rumah
  if(rectOverlap(px,py,player.w,player.h, house.x,house.y,house.w,house.h)){
    restMenu(); return;
  }
  // npc
  for(const n of npcs){
    if(dist(px,py,n.x,n.y)<70){ talkMenu(n); return; }
  }
  // spot memancing
  for(const s of fishingSpots){
    if(dist(px,py,s.x,s.y)<60){ startFishing(s); return; }
  }
  // tumpukan batu
  for(const p of stonePiles){
    if(dist(px,py,p.x,p.y)<50){ showMsg('Tumpukan batu. Klik layar untuk melempar batu.'); return; }
  }
  showMsg('Tidak ada yang bisa diinteraksi di sini.');
}
function tryFishing(){
  const px = player.x, py = player.y;
  for(const s of fishingSpots){
    if(dist(px,py,s.x,s.y)<70){ startFishing(s); return; }
  }
  showMsg('Pergi ke titik memancing di tepi danau.');
}

/* ============================ UPDATE ============================ */
function update(){
  if(overlay.classList.contains('visible') && !fishing) return;

  // gerak pemain
  let dx=0, dy=0;
  if(keys['arrowup']||keys['w']) dy=-1;
  if(keys['arrowdown']||keys['s']) dy=1;
  if(keys['arrowleft']||keys['a']) dx=-1;
  if(keys['arrowright']||keys['d']) dx=1;
  if(dx!==0||dy!==0){
    const len = Math.hypot(dx,dy);
    player.x += (dx/len)*player.speed;
    player.y += (dy/len)*player.speed;
    player.dir = dx>0?'right':dx<0?'left':dy>0?'down':'up';
    // batas dunia (ke dalam area pegunungan/danau)
    player.x = Math.max(40, Math.min(W-40, player.x));
    player.y = Math.max(40, Math.min(H-40, player.y));
  }

  // kamera ikuti pemain
  camera.x = player.x - W/2;
  camera.y = player.y - H/2;
  camera.x = Math.max(0, Math.min(W, camera.x));
  camera.y = Math.max(0, Math.min(H, camera.y));

  // npc jalan
  npcs.forEach(n=>{
    n.x += n.vx; n.y += n.vy;
    n.dir += 0.02;
    if(n.x<150||n.x>W-150) n.vx*=-1;
    if(n.y<150||n.y>H-150) n.vy*=-1;
  });

  // ikan berenang
  fishes.forEach(f=>{
    if(f.caught) return;
    f.x += f.vx; f.y += f.vy;
    const cx=280, cy=170;
    const d = Math.hypot(f.x-cx, f.y-cy);
    const rx=250, ry=150;
    // elips boundary sederhana
    const norm = (f.x-cx)/rx, normy=(f.y-cy)/ry;
    if(norm*norm+normy*normy > 0.92){
      f.vx *= -0.8; f.vy *= -0.8;
      f.x += f.vx; f.y += f.vy;
    }
    if(Math.random()<0.02){ f.vx=(Math.random()-0.5)*1.2; f.vy=(Math.random()-0.5)*1.2; }
  });

  // batu terbang
  stones.forEach((s,i)=>{
    s.x += s.vx; s.y += s.vy; s.life--;
    // tabrakan ikan (simulasi: batu jatuh ke danau)
  });
  stones.filter(s=>s.life>0);

  // waktu berlalu perlahan
  timeMinutes += 0.05;
  if(timeMinutes>=1440) timeMinutes=360;
  const h = Math.floor((timeMinutes/60)%24);
  if(h<6||h>=18) timeOfDay='Malam';
  else if(h<11) timeOfDay='Pagi';
  else if(h<15) timeOfDay='Siang';
  else timeOfDay='Sore';

  updateUI();
}

/* ============================ RENDER ============================ */
function rectOverlap(x1,y1,w1,h1, x2,y2,w2,h2){
  return x1<x2+w2 && x1+w1>x2 && y1<y2+h2 && y1+h1>y2;
}
function dist(x1,y1,x2,y2){ return Math.hypot(x1-x2, y1-y2); }

function drawWorld(){
  // langit
  const sky = timeOfDay==='Malam'?'#2c2c4a':(timeOfDay==='Sore'?'#ff9966':'#87ceeb');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);
  if(timeOfDay==='Malam'){
    ctx.fillStyle='#fff';
    for(let i=0;i<40;i++){ ctx.fillRect(Math.random()*W, Math.random()*H*0.6, 1.5,1.5); }
  }

  // pegunungan di sekitar (belakang)
  ctx.save(); ctx.translate(-camera.x*0.2, -camera.y*0.15);
  ctx.drawImage(IMG.mtn1, 120, 40);
  ctx.drawImage(IMG.mtn2, 560, 60);
  ctx.drawImage(IMG.mtn3, 920, 30);
  ctx.drawImage(IMG.snow, 380, -20);
  ctx.drawImage(IMG.mtn2, 100, 300);
  ctx.drawImage(IMG.mtn1, 820, 320);
  ctx.restore();

  // sungai (keluar dari danau ke kanan bawah)
  ctx.save(); ctx.translate(-camera.x, -camera.y);
  ctx.drawImage(IMG.river, 620, 420);
  // aliran sungai 애니
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(660,460+Math.sin(Date.now()/200)*3); ctx.lineTo(760,500); ctx.stroke();
  ctx.restore();

  // danau di tengah
  ctx.save(); ctx.translate(-camera.x, -camera.y);
  ctx.drawImage(IMG.lake, 280-280, 170-170);

  // ikan
  fishes.forEach(f=>{
    if(f.caught) return;
    ctx.fillStyle=f.color; ctx.beginPath();
    ctx.arc(f.x, f.y, f.r, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(f.x-3, f.y-2, 2.5,0,Math.PI*2); ctx.fill();
  });

  // spot memancing
  fishingSpots.forEach(s=>{
    ctx.strokeStyle='#ffd700'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🎣', s.x, s.y+4);
  });

  // tumpukan batu
  stonePiles.forEach(p=>{
    ctx.drawImage(IMG.stone, p.x-12, p.y-12);
    ctx.fillStyle='#fff'; ctx.font='10px sans-serif'; ctx.textAlign='center';
    ctx.fillText('🪨', p.x+2, p.y+2);
  });

  // rumah
  ctx.drawImage(IMG.house, house.x, house.y);
  ctx.fillStyle='#fff'; ctx.font='13px bold sans-serif'; ctx.textAlign='center';
  ctx.fillText('Rumah Istirahat', house.x+house.w/2, house.y-8);

  // tenda
  tents.forEach(t=>{ ctx.drawImage(IMG.tent, t.x, t.y); });

  // batu dilempar
  stones.forEach(s=>{
    ctx.fillStyle='#95a5a6'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
  });

  // npc
  npcs.forEach(n=>{
    ctx.drawImage(n.img, n.x-14, n.y-14);
    ctx.fillStyle='#fff'; ctx.font='11px sans-serif'; ctx.textAlign='center';
    ctx.fillText(n.nama.split(' ')[0], n.x, n.y-18);
    ctx.fillStyle='#aaa'; ctx.font='10px sans-serif';
    ctx.fillText(n.profesi, n.x, n.y-6);
  });

  // pemain
  ctx.drawImage(IMG.player, player.x-15, player.y-15);
  ctx.fillStyle='#fff'; ctx.font='12px bold sans-serif'; ctx.textAlign='center';
  ctx.fillText('Anda', player.x, player.y-20);

  ctx.restore();

  // petunjuk interaksi dekat
  const near = getNearHint();
  if(near){
    const el=document.getElementById('hint');
    el.textContent = near;
    el.style.display='block';
  } else {
    document.getElementById('hint').style.display='none';
  }
}

function getNearHint(){
  const px=player.x, py=player.y;
  for(const n of npcs) if(dist(px,py,n.x,n.y)<70) return `Bicara dengan ${n.nama} (E)`;
  for(const s of fishingSpots) if(dist(px,py,s.x,s.y)<70) return `Tempat memancing (F)`;
  if(rectOverlap(px,py,player.w,player.h, house.x,house.y,house.w,house.h)) return 'Masuk rumah / Istirahat (E)';
  for(const p of stonePiles) if(dist(px,py,p.x,p.y)<50) return 'Tumpukan batu (klik untuk melempar)';
  return null;
}

function loop(){
  update();
  drawWorld();
  requestAnimationFrame(loop);
}

loop();
updateUI();

</script>
